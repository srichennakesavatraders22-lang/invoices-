name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ─── Windows EXE ──────────────────────────────────────────────────────────
  build-exe:
    name: Build Windows .EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install || npm install

      - name: 🏗️ Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000"

      - name: 🔄 Sync Version from Tag
        working-directory: ./frontend
        run: |
          # PowerShell script to cleanly get version without 'v' prefix
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          npm version $version --no-git-tag-version --allow-same-version

      - name: 🚀 Build EXE
        working-directory: ./frontend
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: "http://localhost:5000"

      - name: 📤 Upload EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            frontend/dist/*.exe
            frontend/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Android APK ──────────────────────────────────────────────────────────
  build-apk:
    name: Build Android .APK
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ☕ Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🔧 Set Gradle JVM heap (4 GB)
        working-directory: ./frontend/android
        shell: pwsh
        run: |
          $props = "gradle.properties"
          if (Test-Path $props) {
            (Get-Content $props) -replace 'org\.gradle\.jvmargs=.*', 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' | Set-Content $props
          }

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install || npm install

      - name: 🏗️ Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: "https://invoices-l4mf.onrender.com"

      - name: 📱 Sync Capacitor Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: 🔨 Build Android APK
        working-directory: ./frontend/android
        run: .\gradlew.bat assembleDebug

      - name: 📤 Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            frontend/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
